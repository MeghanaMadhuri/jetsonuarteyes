; Nina / Jetson — PulseAudio overrides for I2S DACs (e.g. MAX98357A) under heavy CPU load.
; Larger fragments reduce underruns when autonomy + SLAM + depth spike the mixer thread.
; Installed as /etc/pulse/daemon.conf.d/99-nina-i2s-under-load.conf — see nina/systemd/pulse/README.md

; Sample format (align with your I2S card; s32le 48k is common on Tegra)
default-sample-format = s32le
default-sample-rate = 48000
alternate-sample-rate = 48000

avoid-resampling = false

; Default PA is often ~4 × 25 ms = 100 ms; under load use ~8 × 50 ms = 400 ms.
default-fragment-size-msec = 50
default-fragments = 8

high-priority = yes
